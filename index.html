<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Productivity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PERBAIKAN: Memanggil file CSS dari dalam folder 'css' -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Header Card -->
        <div class="card header-card">
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
                <!-- Polished Sun Icon -->
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
                </svg>
                <!-- Polished Moon with Stars Icon -->
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd" />
                    <path d="M16 2.25a.75.75 0 01.75-.75h.5v-.5a.75.75 0 011.5 0v.5h.5a.75.75 0 010 1.5h-.5v.5a.75.75 0 01-1.5 0v-.5h-.5a.75.75 0 01-.75-.75zM19 6.25a.5.5 0 01.5-.5h.25v-.25a.5.5 0 011 0v.25h.25a.5.5 0 010 1h-.25v.25a.5.5 0 01-1 0v-.25h-.25a.5.5 0 01-.5-.5z" />
                </svg>
            </button>
            <div id="clock">00:00:00</div>
            <div id="date">Loading...</div>
            <h1 id="greeting">Hello</h1>
        </div>

        <!-- Timer Card -->
        <div class="card timer-card">
            <h3>Focus Timer</h3>
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-controls">
                <button class="btn-primary" id="timer-start">Start</button>
                <button class="btn-secondary" id="timer-stop">Stop</button>
                <button class="btn-secondary" id="timer-reset">Reset</button>
            </div>
            <div class="timer-settings">
                <label for="timer-input">Duration:</label>
                <input type="number" id="timer-input" value="25" min="1" max="120"> 
                <span>min</span>
                <button class="btn-secondary btn-sm" id="timer-set">Set</button>
            </div>
        </div>

        <!-- Tasks Card -->
        <div class="card tasks-card" style="grid-row: span 2;">
            <h3>Tasks</h3>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button class="btn-primary" id="add-task-btn">Add</button>
            </div>
            <ul class="task-list" id="task-list">
                <!-- Task items injected here via JS -->
            </ul>
        </div>

        <!-- Quick Links Card -->
        <div class="card links-card">
            <h3>Quick Links</h3>
            <div class="link-inputs">
                <input type="text" id="link-name" placeholder="Link name">
                <input type="url" id="link-url" placeholder="URL (e.g., google.com)">
                <button class="btn-primary" id="add-link-btn">Add</button>
            </div>
            <div class="links-container" id="links-container">
                <!-- Links injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="toast">Message here</div>

    <!-- PERBAIKAN: Memanggil file JavaScript dari dalam folder 'js' -->
    <script src="js/app.js"></script>
</body>
</html>
